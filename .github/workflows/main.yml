name: Build Extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 # Diperbarui ke v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4 # Diperbarui ke v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install Ant
      run: sudo apt-get update && sudo apt-get install ant -y

    - name: Build Extension
      run: ant extensions

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # Versi wajib v4 untuk memperbaiki error Anda
      with:
        name: Base64Mahrus-AIX
        path: out/*.aix
        if-no-files-found: error
